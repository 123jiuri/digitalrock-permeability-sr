[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digitalrock-symbolic-regression"
version = "0.2.0"
description = "Rock-grouped LOPO symbolic regression for sandstone permeability"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy==2.1.3",
  "pandas==3.0.2",
  "scikit-learn==1.8.0",
  "sympy==1.14.0",
]

[project.optional-dependencies]
sr = ["pysr==1.5.10", "juliacall==0.9.26", "juliapkg==0.1.23"]

[tool.setuptools.packages.find]
where = ["src"]
