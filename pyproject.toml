[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digitalrock-symbolic-regression"
version = "0.1.0"
description = "Reproducible symbolic regression tools for digital-rock permeability descriptors"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.2",
  "sympy>=1.11",
]

[project.optional-dependencies]
sr = ["pysr>=1.5,<2"]

[tool.setuptools.packages.find]
where = ["src"]
